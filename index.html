<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --earth: #6B3A2E;
    --clay: #8B5A4A;
    --sand: #F2EDE7;
    --paper: #FFFFFF;
    --ink: #1F1A17;
    --muted: #6B5E57;
    --page: #E3DCD5;
    --focus: #C59B7B;
    --highlight: #A84E3A;
    --loto-red: #C0392B;
    --loto-green: #27AE60;
    --loto-yellow: #F1C40F;
    --loto-blue: #2980B9;
    --loto-orange: #E67E22;
    --loto-purple: #8E44AD;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--page);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  /* ================= INTRO: Platillo PNG ================= */
  #splash {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(120% 70% at 50% 35%, #8B5A4A 0%, #4A2C23 70%);
    display: grid; place-items: center;
    animation: splashOut 0.8s ease 1.9s forwards;
    padding: 20px;
  }

  .platillo-wrap {
    position: relative;
    width: min(70vw, 320px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.3) rotate(-8deg);
    animation: platilloIn 1.1s cubic-bezier(.34,1.56,.64,1) 0.1s forwards;
  }

  .platillo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.55));
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .platillo-wrap::before {
    content: '';
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 180, 0.35) 0%, transparent 65%);
    animation: halo 2s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes platilloIn {
    0%   { opacity: 0; transform: scale(0.3) rotate(-8deg); }
    55%  { opacity: 1; transform: scale(1.08) rotate(3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes halo {
    0%, 100% { opacity: 0.5; transform: scale(0.95); }
    50%      { opacity: 0.9; transform: scale(1.05); }
  }

  @keyframes splashOut {
    to { opacity: 0; visibility: hidden; pointer-events: none; }
  }

  /* ================= PÁGINA ================= */
  .page {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    background-color: var(--sand);
    background-image:
      radial-gradient(circle at 15% 5%, rgba(241,196,15,0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 95%, rgba(192,57,43,0.15) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(39,174,96,0.08) 0%, transparent 60%),
      radial-gradient(120% 52% at 50% 0%, #FCF9F5 0%, rgba(252, 249, 245, 0) 100%);
    background-repeat: no-repeat;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.12);
    position: relative;
    overflow: hidden;
  }

  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(107,58,46,0.08) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    pointer-events: none;
    opacity: 0.8;
    z-index: 0;
  }

  .page::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(241,196,15,0.12) 0%, transparent 25%),
      radial-gradient(circle at 90% 70%, rgba(192,57,43,0.10) 0%, transparent 30%),
      radial-gradient(circle at 30% 90%, rgba(41,128,185,0.08) 0%, transparent 25%),
      radial-gradient(circle at 70% 15%, rgba(142,68,173,0.06) 0%, transparent 20%);
  }

  .hero {
    padding: 44px 28px 30px;
    text-align: center;
    animation: heroIn 0.7s ease 1.9s backwards;
    position: relative;
    z-index: 1;
  }
  @keyframes heroIn { from { opacity: 0; } }

  /* ================= PLATO GIRATORIO ================= */
  .medallion-wrap {
    position: relative;
    width: min(58vw, 230px);
    aspect-ratio: 1;
    margin: 0 auto 26px;
    perspective: 800px;
  }

  .medallion {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: #FCF9F5;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    will-change: transform;
    transform: rotate(0deg);
    box-shadow:
      0 0 0 6px #FCF9F5,
      0 0 0 7px rgba(107, 58, 46, 0.12),
      0 0 0 16px rgba(107, 58, 46, 0.04),
      0 22px 34px -10px rgba(0, 0, 0, 0.18);
    transition: box-shadow 0.3s ease;
  }
  .medallion:active {
    cursor: grabbing;
    box-shadow:
      0 0 0 6px #FCF9F5,
      0 0 0 7px rgba(107, 58, 46, 0.22),
      0 0 0 16px rgba(107, 58, 46, 0.08),
      0 28px 40px -10px rgba(0, 0, 0, 0.28);
  }

  .medallion-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .medallion img {
    width: 82%;
    height: 82%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .medallion::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5) 0%, transparent 45%);
    pointer-events: none;
  }

  .medallion-wrap::before {
    content: '↻';
    position: absolute;
    top: 50%;
    right: -32px;
    transform: translateY(-50%);
    font-size: 22px;
    color: rgba(107, 58, 46, 0.5);
    animation: hintSpin 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hintSpin {
    0%, 100% { transform: translateY(-50%) rotate(0deg); opacity: 0.4; }
    50%      { transform: translateY(-50%) rotate(360deg); opacity: 0.9; }
  }

  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.1;
    letter-spacing: 0.02em;
    color: var(--earth);
    text-wrap: balance;
    max-width: 20ch;
    margin: 0 auto;
  }
  .rule {
    width: 56px;
    height: 1px;
    margin: 16px auto 14px;
    background: linear-gradient(90deg, transparent, #BFA99B, transparent);
  }
  .lead {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 32ch;
    margin: 0 auto;
    text-wrap: balance;
    font-weight: 400;
  }

  .sheet {
    flex: 1;
    padding: 10px 20px 26px;
    animation: sheetUp 0.8s cubic-bezier(.2,.7,.2,1) 2.05s backwards;
    position: relative;
    z-index: 1;
  }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(40px); } }

  .group + .group { margin-top: 26px; }
  .group-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 4px 10px;
  }
  .list { display: grid; gap: 12px; list-style: none; }

  .row {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 14px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--ink);
    background: linear-gradient(180deg, #FFFFFF 0%, #F6F2ED 100%);
    border: 1px solid #E8DFD7;
    box-shadow:
      inset 0 1px 0 #fff,
      0 1px 2px rgba(0, 0, 0, 0.06),
      0 10px 20px -10px rgba(107, 58, 46, 0.18);
    transition:
      transform 0.22s cubic-bezier(.2,.8,.2,1),
      box-shadow 0.22s ease,
      background-color 0.22s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .row::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -70%;
    width: 45%;
    background: linear-gradient(100deg, transparent 0%, rgba(139, 90, 74, 0.10) 50%, transparent 100%);
    transform: skewX(-18deg);
    pointer-events: none;
  }
  .row > .tile, .row > .txt, .row > .chev { position: relative; }

  .tile {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 11px;
    background: linear-gradient(160deg, #8B5A4A 0%, #6B3A2E 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.20), 0 5px 10px -3px rgba(107, 58, 46, 0.35);
    display: grid; place-items: center;
    transition: transform 0.28s cubic-bezier(.3,1.5,.5,1);
  }
  .tile svg { width: 22px; height: 22px; }

  .tile--google { background: #fff !important; border: 1px solid #E8DFD7; }

  .txt { flex: 1; min-width: 0; }
  .name { display: block; font-weight: 500; font-size: 15.5px; line-height: 1.3; color: var(--ink); }
  .sub  { display: block; font-size: 13px; line-height: 1.35; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
  .chev {
    flex: none; width: 18px; height: 18px;
    color: #B8A99F;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), color 0.2s ease;
  }

  .row--primary {
    padding: 16px 14px;
    background: linear-gradient(180deg, #F7F0EA 0%, #EFE4DC 100%);
    border-color: #D9C9BE;
    box-shadow:
      inset 0 1px 0 #fff,
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 22px -10px rgba(107, 58, 46, 0.28);
  }
  @media (hover: hover) {
    .row--primary:hover { background: linear-gradient(180deg, #F7F0EA 0%, #E5D6CC 100%); }
  }

  @media (hover: hover) {
    .row:hover {
      transform: translateY(-4px);
      background: linear-gradient(180deg, #FFFFFF 0%, #F1EAE4 100%);
      box-shadow:
        inset 0 1px 0 #fff,
        0 2px 4px rgba(0, 0, 0, 0.06),
        0 22px 32px -12px rgba(107, 58, 46, 0.35);
    }
    .row:hover::before { left: 130%; transition: left 0.7s ease; }
    .row:hover .tile { transform: scale(1.08) rotate(-5deg); }
    .row:hover .chev { transform: translateX(4px); color: var(--earth); }
  }

  .row:active {
    transform: translateY(1px) scale(0.975);
    box-shadow:
      inset 0 2px 6px rgba(107, 58, 46, 0.12),
      0 3px 8px -4px rgba(0, 0, 0, 0.20);
    transition-duration: 0.08s;
  }
  .row:active .tile { transform: scale(0.94); }
  .row:active .chev,
  .row:focus-visible .chev { color: var(--earth); }
  .row:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(107, 58, 46, 0.12);
    transform: scale(0);
    animation: ripple 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }

  .foot {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(107, 58, 46, 0.10);
    text-align: center;
  }
  .foot p:first-child {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--earth);
  }
  .foot p + p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    #splash { display: none; }
    .hero, .sheet { animation: none; }
    .row, .tile, .chev { transition: none; }
    .row:hover, .row:active { transform: none; }
    .row::before, .ripple { display: none; }
    .medallion-wrap::before { display: none; }
  }

  @media (min-width: 520px) {
    body { align-items: flex-start; }
  }
</style>
</head>

<script>
  // Ripple en botones
  document.querySelectorAll('.row').forEach(function (row) {
    row.addEventListener('pointerdown', function (e) {
      var r = row.getBoundingClientRect();
      var d = Math.max(r.width, r.height) * 1.5;
      var w = document.createElement('span');
      w.className = 'ripple';
      w.style.width = w.style.height = d + 'px';
      w.style.left = (e.clientX - r.left - d / 2) + 'px';
      w.style.top = (e.clientY - r.top - d / 2) + 'px';
      row.appendChild(w);
      setTimeout(function () { w.remove(); }, 650);
    });
  });

  // ================= PLATO GIRATORIO =================
  (function () {
    var plato = document.getElementById('platoGiratorio');
    if (!plato) return;

    var rotacion = 0;
    var velocidad = 0;
    var arrastrando = false;
    var ultimoAngulo = 0;
    var ultimoTiempo = 0;
    var animando = false;

    function anguloDesdeCentro(x, y) {
      var rect = plato.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      return Math.atan2(y - cy, x - cx) * (180 / Math.PI);
    }

    function aplicar() {
      plato.style.transform = 'rotate(' + rotacion + 'deg)';
    }

    function inercia() {
      if (Math.abs(velocidad) < 0.05) {
        velocidad = 0;
        animando = false;
        return;
      }
      rotacion += velocidad;
      velocidad *= 0.95;
      aplicar();
      requestAnimationFrame(inercia);
    }

    plato.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      arrastrando = true;
      animando = false;
      velocidad = 0;
      ultimoAngulo = anguloDesdeCentro(e.clientX, e.clientY);
      ultimoTiempo = performance.now();
      plato.setPointerCapture(e.pointerId);
    });

    plato.addEventListener('pointermove', function (e) {
      if (!arrastrando) return;
      var anguloActual = anguloDesdeCentro(e.clientX, e.clientY);
      var delta = anguloActual - ultimoAngulo;

      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;

      rotacion += delta;

      var ahora = performance.now();
      var dt = ahora - ultimoTiempo;
      if (dt > 0) {
        velocidad = delta / dt * 16;
      }

      ultimoAngulo = anguloActual;
      ultimoTiempo = ahora;
      aplicar();
    });

    plato.addEventListener('pointerup', function (e) {
      if (!arrastrando) return;
      arrastrando = false;
      if (Math.abs(velocidad) > 0.3) {
        animando = true;
        inercia();
      }
    });

    plato.addEventListener('pointercancel', function () {
      arrastrando = false;
    });

    var tiempoDown = 0;
    plato.addEventListener('pointerdown', function () {
      tiempoDown = performance.now();
    });
    plato.addEventListener('click', function () {
      if (performance.now() - tiempoDown < 200 && !arrastrando && !animando) {
        var inicio = rotacion;
        var destino = rotacion + 360;
        var duracion = 800;
        var t0 = performance.now();

        function animarGiro(now) {
          var t = Math.min((now - t0) / duracion, 1);
          var eased = 1 - Math.pow(1 - t, 3);
          rotacion = inicio + (destino - inicio) * eased;
          aplicar();
          if (t < 1) requestAnimationFrame(animarGiro);
        }
        requestAnimationFrame(animarGiro);
      }
    });
  })();
</script>

</body>
